[project]
name = "real2sim-toolkit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "openai",
    "pillow",
    "tyro",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/r2st"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.16.1",
    "pytest>=8.0",
    "opencv-python>=4.0",
    "matplotlib>=3.0",
    "torch>=2.0",
    "transforms3d>=0.4",
    "trimesh>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
