[project]
name = "real2sim-toolkit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cma>=4.4.4",
    "cuda-toolkit[cccl,nvcc]>=13.0.3.0",
    "einops",
    "grpcio>=1.83.0",
    "h5py>=3.16.0",
    "jrl2",
    "mani_skill",
    "matplotlib>=3.11.1",
    "ninja>=1.13.0",
    "numpy",
    "onnx>=1.22.0",
    "onnxruntime>=1.28.0",
    "onnxscript==0.7.2",
    "open3d>=0.19.0",
    "openai",
    "opencv-python>=4.0",
    "pillow",
    "pycocotools>=2.0.11",
    "pyg-lib>=0.6.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sam3",
    "tensorrt-cu13==11.4.0.106",
    "termcolor>=3.3.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
    "transformers>=4.36.2",
    "transforms3d>=0.4.2",
    "trimesh>=4.12.2",
    "tyro",
    "viser>=1.0.30",
    "warp-lang>=1.16.0",
    "xacrodoc>=2.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/r2st"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.16.1",
    "pytest>=8.0",
    "opencv-python>=4.0",
    "matplotlib>=3.0",
    "torch>=2.0",
    "transforms3d>=0.4",
    "trimesh>=4.0",
    "transformers==4.36.2",
    "timm>=1.0.28",
    "addict>=2.4.0",
    "yapf>=0.43.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# Tests that call the real OpenAI API spend credits, so they only run when asked for: `pytest -m live_openai`.
markers = ["live_openai: calls the real OpenAI API (spends credits)"]
addopts = "-m 'not live_openai'"

[tool.uv]
find-links = ["https://data.pyg.org/whl/torch-2.13.0+cu130.html"]

[tool.uv.sources]
jrl2 = { path = "thirdparty/Jrl2", editable = true }
mani_skill = { path = "thirdparty/ManiSkill", editable = true }
sam3 = { path = "src/r2st/sam3", editable = true }
